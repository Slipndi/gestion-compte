<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Budget</title>
    <!-- Tailwind via CDN (JIT in navigateur) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#020617',
              card: '#020617',
              cardSoft: '#0f172a',
              accent: '#22c55e',
              accentSoft: 'rgba(34,197,94,0.12)',
              danger: '#ef4444',
            },
          }
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body class="min-h-screen bg-bg text-slate-100 flex flex-col items-center justify-center">
    <!-- AUTH -->
    <section id="auth" class="w-full max-w-md px-4">
      <div class="bg-slate-950/80 border border-slate-800/80 rounded-3xl shadow-2xl shadow-black/70 px-6 pt-6 pb-5 backdrop-blur">
        <div class="flex items-center gap-3 mb-5">
          <div class="h-10 w-10 rounded-2xl bg-emerald-500/10 border border-emerald-400/40 flex items-center justify-center text-emerald-400">
            <span class="text-xl">€</span>
          </div>
          <div>
            <h1 class="text-xl font-semibold tracking-tight">Budget</h1>
            <p id="auth-sub" class="text-xs text-slate-400">Connecte-toi pour accéder à tes comptes.</p>
          </div>
        </div>

        <div class="space-y-2 mb-3">
          <input id="email" type="email" autocomplete="email" placeholder="Email"
                 class="w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/70 focus:border-emerald-400/70 transition" />
          <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"
                 class="w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/70 focus:border-emerald-400/70 transition" />
        </div>

        <button id="auth-go"
                class="mt-1 inline-flex w-full items-center justify-center gap-2 rounded-full bg-emerald-500 px-4 py-2.5 text-sm font-medium text-slate-950 shadow-[0_12px_40px_rgba(16,185,129,0.5)] hover:bg-emerald-400 active:scale-[0.97] transition">
          Se connecter
        </button>

        <p id="auth-err" class="min-h-[18px] mt-2 text-[11px] text-danger"></p>

        <button id="auth-toggle" type="button" class="mt-1 w-full text-[11px] text-slate-400 hover:text-slate-200 transition">
          Pas de compte ? Créer un compte
        </button>
      </div>

      <p class="mt-4 text-[11px] text-slate-500 text-center">PWA disponible : installe l'app depuis ton navigateur.</p>
    </section>

    <!-- APP -->
    <main id="app" class="w-full max-w-md px-4 pb-24 pt-4 hidden"></main>

    <!-- NAV -->
    <nav id="nav" class="fixed bottom-3 left-0 right-0 flex justify-center pointer-events-none opacity-0 transition-opacity duration-200">
      <div class="w-full max-w-md mx-4 rounded-full border border-slate-800 bg-slate-950/90 shadow-[0_18px_55px_rgba(0,0,0,0.85)] backdrop-blur flex items-center justify-around py-2 px-1 text-[11px]">
        <button data-tab="mois" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
          <span class="text-[18px]">◉</span>
          <span>Mois</span>
        </button>
        <button data-tab="recurrents" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
          <span class="text-[18px]">↻</span>
          <span>Récurrents</span>
        </button>
        <button data-tab="categories" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
          <span class="text-[18px]">▦</span>
          <span>Catégories</span>
        </button>
        <button data-tab="revenus" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-400">
          <span class="text-[18px]">↟</span>
          <span>Revenus</span>
        </button>
        <button id="logout" class="flex flex-col items-center gap-0.5 px-3 py-1 text-slate-500" title="Déconnexion">
          <span class="text-[18px]">⎋</span>
          <span>Quitter</span>
        </button>
      </div>
    </nav>

    <div id="modal-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        "use strict";
        const SUPABASE_URL = "https://xvuyqoprzogmfwhtffvw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dXlxb3Byem9nbWZ3aHRmZnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODg4NTMsImV4cCI6MjA5NTI2NDg1M30.Hv-V2wBAh_OPKAcz60jBkizRXvGxZaSRkv9hk6-8Vic";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const $ = (id) => document.getElementById(id);
        const app = $("app");
        const auth = $("auth");
        const nav = $("nav");
        const fmt = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
        const fmt0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
        const monthLabel = (d) => new Intl.DateTimeFormat("fr-FR", { month:"long", year:"numeric" }).format(d);
        const PALETTE = ["#22c55e","#0ea5e9","#a855f7","#f97316","#eab308","#22d3ee","#f43f5e","#14b8a6","#38bdf8","#6366f1"];
        const SEED_CATS = [
          ["Course","#22c55e"],["Essence","#f97316"],["Loisirs","#a855f7"],["Habits","#0ea5e9"],
          ["Enfants","#eab308"],["Santé","#f43f5e"],["Maison","#38bdf8"],["Autres","#64748b"],
        ];
        const SEED_RECS = [
          ["Maison (prêt)",960,null],["Prêt voiture",555,4],["Wegovy",190,null],["Crédit conso",180,4],
          ["Cantines",160,null],["EDF",120,null],["GMF",120,null],["Panneaux solaires",110,null],
          ["Mutuelle",107,null],["Enfants",97,null],["Taxe foncière",88,15],["Drawer",80,null],
          ["iPhone",75,null],["CBP",56,null],["Veolia (eau)",56,null],["SFR",54,null],["Coiffeur",50,null],
          ["Assurance vie",20,null],["Deezer",19,null],["Cb",18,null],["Netflix",14,null],["Amazon Prime",7,null],
        ];

        let session = null, tab = "mois";
        let cur = startOfMonth(new Date());
        let categories = [], recurrents = [], depenses = [], revDefault = null, revMonth = null;

        function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
        function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }
        function shiftMonth(d, n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
        const k = () => monthKey(cur);

        // ── Auth UI ─────────────────────────────
        let mode = "in";
        $("auth-toggle").onclick = () => {
          mode = mode === "in" ? "up" : "in";
          $("auth-sub").textContent = mode === "in" ? "Connecte-toi pour accéder à tes comptes." : "Crée ton compte (email + mot de passe).";
          $("auth-go").textContent = mode === "in" ? "Se connecter" : "Créer le compte";
          $("auth-toggle").textContent = mode === "in" ? "Pas de compte ? Créer un compte" : "Déjà un compte ? Se connecter";
          $("auth-err").textContent = "";
        };
        $("auth-go").onclick = doAuth;
        $("password").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });

        async function doAuth(){
          const email = $("email").value.trim(), password = $("password").value;
          $("auth-err").textContent = "";
          if (!email || !password) return ($("auth-err").textContent = "Email et mot de passe requis.");
          const fn = mode === "in" ? sb.auth.signInWithPassword({ email, password }) : sb.auth.signUp({ email, password });
          const { data, error } = await fn;
          if (error) return ($("auth-err").textContent = error.message);
          if (mode === "up" && !data.session) return ($("auth-err").textContent = "Compte créé. Confirme l'email puis connecte-toi.");
        }

        sb.auth.onAuthStateChange((_e, s) => {
          session = s;
          if (s) showApp(); else showAuth();
        });

        function showAuth(){
          auth.hidden = false;
          app.hidden = true;
          nav.classList.remove("pointer-events-auto", "opacity-100");
          nav.classList.add("pointer-events-none", "opacity-0");
        }
        async function showApp(){
          auth.hidden = true;
          app.hidden = false;
          nav.classList.remove("pointer-events-none", "opacity-0");
          nav.classList.add("pointer-events-auto", "opacity-100");
          await bootstrap();
          render();
        }

        // ── Data ───────────────────────────────
        async function bootstrap(){
          let { data: cats } = await sb.from("categories").select("*").order("name");
          if (!cats || cats.length === 0){
            await sb.from("categories").insert(SEED_CATS.map(([name,color]) => ({ name, color })));
            ({ data: cats } = await sb.from("categories").select("*").order("name"));
          }
          categories = cats || [];

          let { data: rd } = await sb.from("revenu_defaults").select("*").maybeSingle();
          if (!rd){
            await sb.from("revenu_defaults").insert({ ludovic: 2640, marie_laure: 2300, aides: 616 });
            ({ data: rd } = await sb.from("revenu_defaults").select("*").maybeSingle());
          }
          revDefault = rd;

          const { data: recs } = await sb.from("recurrents").select("*").order("amount", { ascending:false });
          recurrents = recs || [];

          await loadMonth();
        }

        async function loadMonth(){
          const { data: deps } = await sb.from("depenses").select("*").eq("month", k()).order("spent_on", { ascending:false });
          depenses = deps || [];
          const { data: rm } = await sb.from("revenu_months").select("*").eq("month", k()).maybeSingle();
          revMonth = rm || null;
        }

        function income(){
          const r = revMonth || revDefault || { ludovic:0, marie_laure:0, aides:0 };
          return Number(r.ludovic) + Number(r.marie_laure) + Number(r.aides);
        }
        function recsForMonth(){
          const key = k();
          return recurrents.filter(r => r.active && r.start_month <= key && (!r.end_month || r.end_month >= key));
        }
        const recTotal = () => recsForMonth().reduce((s,r) => s + Number(r.amount), 0);
        const depTotal = () => depenses.reduce((s,d) => s + Number(d.amount), 0);
        const reste = () => income() - recTotal() - depTotal();

        // ── Render dispatcher ──────────────────
        function render(){
          nav.querySelectorAll("[data-tab]").forEach(b => {
            const on = b.dataset.tab === tab;
            b.classList.toggle("text-emerald-400", on);
            b.classList.toggle("text-slate-400", !on);
          });
          if (tab === "mois") renderMois();
          else if (tab === "recurrents") renderRecurrents();
          else if (tab === "categories") renderCategories();
          else if (tab === "revenus") renderRevenus();
        }

        nav.addEventListener("click", e => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          render();
        });
        $("logout").onclick = () => sb.auth.signOut();

        function header(extra = ""){ return `
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <button id="m-prev" class="h-8 w-8 rounded-xl border border-slate-800 bg-slate-900/70 flex items-center justify-center text-slate-400 text-sm hover:text-emerald-400 hover:border-emerald-500/50 transition">‹</button>
              <div>
                <p class="text-[11px] uppercase tracking-[0.16em] text-slate-500">${tab === "mois" ? "Vue mensuelle" : tabName()}</p>
                <h2 class="text-lg font-semibold leading-tight capitalize">${tab === "mois" ? monthLabel(cur) : tabName()}</h2>
              </div>
            </div>
            <button id="m-next" class="h-8 w-8 rounded-xl border border-slate-800 bg-slate-900/70 flex items-center justify-center text-slate-400 text-sm hover:text-emerald-400 hover:border-emerald-500/50 transition">${tab === "mois" ? "›" : ""}</button>
          </div>
          ${extra}
        `; }
        function tabName(){ return { recurrents:"Récurrents", categories:"Catégories", revenus:"Revenus" }[tab] || ""; }
        function wireHeader(){
          const prev = $("m-prev"), next = $("m-next");
          if (tab === "mois"){
            prev.onclick = async () => { cur = shiftMonth(cur,-1); await loadMonth(); render(); };
            next.onclick = async () => { cur = shiftMonth(cur, 1); await loadMonth(); render(); };
          } else {
            prev.classList.add("opacity-0", "pointer-events-none");
            next.classList.add("opacity-0", "pointer-events-none");
          }
        }

        // ── MOIS ───────────────────────────────
        function renderMois(){
          const inc = income(), rec = recTotal(), dep = depTotal(), rst = reste();
          const engaged = inc > 0 ? Math.min(100, Math.round((rec+dep)/inc*100)) : 0;
          const recPct = inc > 0 ? Math.round(rec/inc*100) : 0;

          const now = new Date(), isCurrent = now.getFullYear()===cur.getFullYear() && now.getMonth()===cur.getMonth();
          const daysInMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
          const daysLeft = isCurrent ? Math.max(1, daysInMonth - now.getDate() + 1) : daysInMonth;
          const perDay = rst > 0 ? rst / daysLeft : 0;

          const byCat = {};
          depenses.forEach(d => { const c = d.category_id || "∅"; byCat[c] = (byCat[c]||0) + Number(d.amount); });
          const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3)
            .map(([cid,amt]) => { const c = categories.find(x=>x.id===cid); return { name: c?c.name:"Sans catégorie", color: c?c.color:"#64748b", amt }; });
          const topHtml = top.length
            ? '<div class="mt-3 space-y-1.5">' +
              top.map(t =>
                '<div class="flex items-center justify-between text-[11px]">' +
                  '<div class="flex items-center gap-2">' +
                    '<span class="h-2 w-2 rounded-full" style="background:' + t.color + '"></span>' +
                    '<span>' + esc(t.name) + '</span>' +
                  '</div>' +
                  '<span class="font-medium">' + fmt.format(t.amt) + '</span>' +
                '</div>'
              ).join('') +
              '</div>'
            : '';

          app.innerHTML = header(`
            <section class="space-y-3">
              <div class="rounded-3xl bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800/80 px-4 py-4 shadow-xl">
                <p class="text-[11px] uppercase tracking-[0.18em] text-slate-400">Reste à dépenser</p>
                <p class="mt-1 text-[30px] font-semibold leading-none tracking-tight ${rst<0 ? 'text-rose-400' : 'text-emerald-400'}">${fmt.format(rst)}</p>
                <div class="mt-3 grid grid-cols-3 gap-2 text-[11px] text-slate-400">
                  <div>
                    <p class="text-[10px] uppercase tracking-[0.16em] text-slate-500">Revenus</p>
                    <p class="font-medium text-slate-100">${fmt.format(inc)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] uppercase tracking-[0.16em] text-slate-500">Récurrents</p>
                    <p class="font-medium text-slate-100">-${fmt.format(rec)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] uppercase tracking-[0.16em] text-slate-500">Dépenses</p>
                    <p class="font-medium text-slate-100">-${fmt.format(dep)}</p>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-3">
                  <p class="text-[10px] uppercase tracking-[0.16em] text-slate-500">Engagé</p>
                  <p class="mt-1 text-xl font-semibold">${engaged}%</p>
                  <div class="mt-2 h-1.5 w-full rounded-full bg-slate-800 overflow-hidden">
                    <div class="h-full rounded-full bg-emerald-500" style="width:${engaged}%"></div>
                  </div>
                </div>
                <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-3">
                  <p class="text-[10px] uppercase tracking-[0.16em] text-slate-500">${isCurrent?"Reste / jour":"Disponible / jour"}</p>
                  <p class="mt-1 text-xl font-semibold">${fmt0.format(perDay)}</p>
                  <p class="mt-1 text-[11px] text-slate-400">${daysLeft} j ${isCurrent?"restants":""}</p>
                </div>
              </div>

              <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-3">
                <div class="flex items-center justify-between">
                  <p class="text-[11px] text-slate-400">Poids des récurrents</p>
                  <p class="text-sm font-medium">${recPct}%</p>
                </div>
                ${topHtml}
              </div>
            </section>

            <section class="mt-5">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium">Dépenses</h3>
                <button id="add-dep" class="inline-flex items-center rounded-full bg-emerald-500/10 px-3 py-1.5 text-[11px] font-medium text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/20 active:scale-[0.97] transition">+ Dépense</button>
              </div>
              <div id="dep-list" class="space-y-1.5">${depList()}</div>
            </section>
          `);
          wireHeader();
          $("add-dep").onclick = () => depModal();
          wireDepList();
        }


        function depList(){
          if (!depenses.length) return `<div class="text-[12px] text-slate-500 text-center py-4 border border-dashed border-slate-800 rounded-2xl">Aucune dépense ce mois-ci.</div>`;
          return depenses.map(d => {
            const c = categories.find(x => x.id === d.category_id);
            return `<div class="flex items-center gap-2 rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-[12px]" data-id="${d.id}">
              <span class="h-2 w-2 rounded-full" style="background:${c?c.color:'#64748b'}"></span>
              <div class="flex-1 min-w-0">
                <div class="truncate">${esc(d.label)}</div>
                <div class="text-[11px] text-slate-500">${c?esc(c.name):'Sans catégorie'} · ${d.spent_on?.slice(8,10)}/${d.spent_on?.slice(5,7)}</div>
              </div>
              <span class="text-[12px] font-medium">${fmt.format(d.amount)}</span>
              <button class="ml-1 rounded-xl border border-slate-800 px-2 py-1 text-[11px] text-slate-400 hover:text-emerald-400 hover:border-emerald-500/50 act-edit">Éditer</button>
              <button class="rounded-xl border border-slate-800 px-2 py-1 text-[11px] text-rose-400 hover:border-rose-500/70 act-del">Suppr.</button>
            </div>`;
          }).join('');
        }

        function wireDepList(){
          $("dep-list").addEventListener("click", async e => {
            const row = e.target.closest("[data-id]"); if (!row) return;
            const d = depenses.find(x => x.id === row.dataset.id);
            if (e.target.classList.contains("act-del")){
              await sb.from("depenses").delete().eq("id", d.id); await loadMonth(); render();
            } else if (e.target.classList.contains("act-edit")) depModal(d);
          });
        }

        function depModal(d){
          const opts = categories.map(c => `<option value="${c.id}" ${d&&d.category_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
          openModal(`
            <h2 class="text-base font-semibold mb-3">${d?"Modifier la dépense":"Nouvelle dépense"}</h2>
            <div class="space-y-2">
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Nom</label>
                <input id="d-label" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${d?esc(d.label):""}" placeholder="ex. Carrefour" />
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Montant (€)</label>
                <input id="d-amount" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${d?d.amount:""}" />
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Catégorie</label>
                <select id="d-cat" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm"><option value="">Sans catégorie</option>${opts}</select>
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Date</label>
                <input id="d-date" type="date" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${d?d.spent_on:new Date().toISOString().slice(0,10)}" />
              </div>
              <button id="d-save" class="mt-2 w-full rounded-full bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400 active:scale-[0.98] transition">${d?"Enregistrer":"Ajouter"}</button>
            </div>
          `);
          $("d-save").onclick = async () => {
            const label = $("d-label").value.trim();
            const amount = parseFloat($("d-amount").value.replace(",","."));
            if (!label || isNaN(amount)) return;
            const payload = { label, amount, category_id: $("d-cat").value || null, spent_on: $("d-date").value, month: k() };
            if (d) await sb.from("depenses").update(payload).eq("id", d.id);
            else await sb.from("depenses").insert(payload);
            closeModal(); await loadMonth(); render();
          };
        }

        // ── Recurrents / Categories / Revenus (visuel Tailwind mais logique identique)
        // Pour garder la taille raisonnable, on conserve ta logique existante,
        // seule la structure HTML est modernisée (cartes, boutons, etc.).

        function renderRecurrents(){
          let body;
          if (!recurrents.length){
            body = `<div class="text-[12px] text-slate-500 text-center py-6 border border-dashed border-slate-800 rounded-2xl">Aucun récurrent.<br/><button id="seed-rec" class="mt-3 rounded-full border border-slate-700 px-3 py-1.5 text-[11px] text-slate-300 hover:border-emerald-500/60 hover:text-emerald-400">Importer le modèle</button></div>`;
          } else {
            body = recurrents.map(r => {
              const ends = r.end_month ? `fin ${r.end_month.slice(5,7)}/${r.end_month.slice(0,4)}` : "sans fin";
              return `<div class="flex items-center gap-2 rounded-2xl border ${r.active?'border-slate-800 bg-slate-950/60':'border-slate-800/60 bg-slate-950/30 opacity-60'} px-3 py-2 text-[12px]" data-id="${r.id}">
                <div class="flex-1 min-w-0">
                  <div class="truncate">${esc(r.label)}</div>
                  <div class="text-[11px] text-slate-500">${r.day?`le ${r.day} · `:""}${ends}</div>
                </div>
                <span class="text-[12px] font-medium">${fmt.format(r.amount)}</span>
                <button class="ml-1 rounded-xl border border-slate-700 px-2 py-1 text-[11px] text-slate-300 hover:text-emerald-400 hover:border-emerald-500/60 act-toggle">${r.active?"Pause":"Activer"}</button>
                <button class="rounded-xl border border-slate-700 px-2 py-1 text-[11px] text-slate-300 hover:text-emerald-400 hover:border-emerald-500/60 act-edit">Éditer</button>
                <button class="rounded-xl border border-slate-700 px-2 py-1 text-[11px] text-rose-400 hover:border-rose-500/70 act-del">Suppr.</button>
              </div>`;
            }).join('');
          }
          app.innerHTML = header(`
            <section class="space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-medium">Paiements récurrents</h3>
                <button id="add-rec" class="inline-flex items-center rounded-full bg-emerald-500/10 px-3 py-1.5 text-[11px] font-medium text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/20 active:scale-[0.97] transition">+ Ajouter</button>
              </div>
              <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-[12px] flex items-center justify-between">
                <span class="text-slate-400">Total actif ce mois (${recsForMonth().length})</span>
                <span class="font-medium">${fmt.format(recTotal())}</span>
              </div>
              <div id="rec-list" class="space-y-1.5">${body}</div>
            </section>
          `);
          wireHeader();
          $("add-rec").onclick = () => recModal();
          if ($("seed-rec")) $("seed-rec").onclick = async () => {
            const sm = monthKey(startOfMonth(new Date()));
            await sb.from("recurrents").insert(SEED_RECS.map(([label,amount,day]) => ({ label, amount, day, start_month: sm, end_month: null, active: true })));
            const { data } = await sb.from("recurrents").select("*").order("amount",{ascending:false}); recurrents = data||[]; render();
          };
          $("rec-list").addEventListener("click", async e => {
            const row = e.target.closest("[data-id]"); if (!row) return;
            const r = recurrents.find(x => x.id === row.dataset.id);
            if (e.target.classList.contains("act-del")){
              await sb.from("recurrents").delete().eq("id", r.id); await reloadRecs();
            } else if (e.target.classList.contains("act-toggle")){
              await sb.from("recurrents").update({ active: !r.active }).eq("id", r.id); await reloadRecs();
            } else if (e.target.classList.contains("act-edit")) recModal(r);
          });
        }

        async function reloadRecs(){ const { data } = await sb.from("recurrents").select("*").order("amount",{ascending:false}); recurrents = data||[]; render(); }

        function recModal(r){
          const ym = (s) => s ? s.slice(0,7) : "";
          openModal(`
            <h2 class="text-base font-semibold mb-3">${r?"Modifier le récurrent":"Nouveau récurrent"}</h2>
            <div class="space-y-2">
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Libellé</label>
                <input id="r-label" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${r?esc(r.label):""}" />
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Montant (€)</label>
                <input id="r-amount" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${r?r.amount:""}" />
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Jour de prélèvement (optionnel)</label>
                <input id="r-day" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="numeric" value="${r&&r.day?r.day:""}" />
              </div>
              <div class="flex gap-2">
                <div class="flex-1">
                  <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Début</label>
                  <input id="r-start" type="month" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${r?ym(r.start_month):monthKey(cur).slice(0,7)}" />
                </div>
                <div class="flex-1">
                  <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Fin (optionnel)</label>
                  <input id="r-end" type="month" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${r?ym(r.end_month):""}" />
                </div>
              </div>
              <button id="r-save" class="mt-2 w-full rounded-full bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400 active:scale-[0.98] transition">${r?"Enregistrer":"Ajouter"}</button>
            </div>
          `);
          $("r-save").onclick = async () => {
            const label = $("r-label").value.trim();
            const amount = parseFloat($("r-amount").value.replace(",","."));
            if (!label || isNaN(amount)) return;
            let day = $("r-day").value === "" ? null : Math.min(31, Math.max(1, parseInt($("r-day").value,10)));
            if (Number.isNaN(day)) day = null;
            const start = ($("r-start").value || monthKey(cur).slice(0,7)) + "-01";
            const end = $("r-end").value ? $("r-end").value + "-01" : null;
            const payload = { label, amount, day, start_month: start, end_month: end };
            if (r) await sb.from("recurrents").update(payload).eq("id", r.id);
            else await sb.from("recurrents").insert({ ...payload, active: true });
            closeModal(); await reloadRecs();
          };
        }

        function renderCategories(){
          const body = categories.length ? categories.map(c => `
            <div class="flex items-center gap-2 rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-[12px]" data-id="${c.id}">
              <span class="h-3 w-3 rounded-full" style="background:${c.color}"></span>
              <div class="flex-1 min-w-0 truncate">${esc(c.name)}</div>
              <button class="rounded-xl border border-slate-700 px-2 py-1 text-[11px] text-slate-300 hover:text-emerald-400 hover:border-emerald-500/60 act-edit">Éditer</button>
              <button class="rounded-xl border border-slate-700 px-2 py-1 text-[11px] text-rose-400 hover:border-rose-500/70 act-del">Suppr.</button>
            </div>`).join("") : `<div class="text-[12px] text-slate-500 text-center py-4 border border-dashed border-slate-800 rounded-2xl">Aucune catégorie.</div>`;
          app.innerHTML = header(`
            <section class="space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-medium">Catégories</h3>
                <button id="add-cat" class="inline-flex items-center rounded-full bg-emerald-500/10 px-3 py-1.5 text-[11px] font-medium text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/20 active:scale-[0.97] transition">+ Ajouter</button>
              </div>
              <div id="cat-list" class="space-y-1.5">${body}</div>
            </section>
          `);
          wireHeader();
          $("add-cat").onclick = () => catModal();
          $("cat-list").addEventListener("click", async e => {
            const row = e.target.closest("[data-id]"); if (!row) return;
            const c = categories.find(x => x.id === row.dataset.id);
            if (e.target.classList.contains("act-del")){
              if (!confirm(`Supprimer « ${c.name} » ? Les dépenses liées passeront en « sans catégorie ».`)) return;
              await sb.from("categories").delete().eq("id", c.id); await reloadCats();
            } else if (e.target.classList.contains("act-edit")) catModal(c);
          });
        }

        async function reloadCats(){ const { data } = await sb.from("categories").select("*").order("name"); categories = data||[]; render(); }

        function catModal(c){
          const color = c ? c.color : PALETTE[0];
          openModal(`
            <h2 class="text-base font-semibold mb-3">${c?"Modifier la catégorie":"Nouvelle catégorie"}</h2>
            <div class="space-y-3">
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Nom</label>
                <input id="c-name" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" value="${c?esc(c.name):""}" />
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Couleur</label>
                <div id="c-sw" class="mt-1 flex flex-wrap gap-2">${PALETTE.map(p=>`<button type="button" class="h-7 w-7 rounded-full border-2 ${p===color?"border-slate-50":"border-transparent"}" style="background:${p}" data-c="${p}"></button>`).join('')}</div>
              </div>
              <button id="c-save" class="mt-2 w-full rounded-full bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400 active:scale-[0.98] transition">${c?"Enregistrer":"Ajouter"}</button>
            </div>
          `);
          let sel = color;
          $("c-sw").addEventListener("click", e => {
            const s = e.target.closest("[data-c]"); if (!s) return;
            sel = s.dataset.c; [...$("c-sw").children].forEach(x => x.classList.toggle("border-slate-50", x===s));
          });
          $("c-save").onclick = async () => {
            const name = $("c-name").value.trim(); if (!name) return;
            if (c) await sb.from("categories").update({ name, color: sel }).eq("id", c.id);
            else await sb.from("categories").insert({ name, color: sel });
            closeModal(); await reloadCats();
          };
        }

        function renderRevenus(){
          const d = revDefault || { ludovic:0, marie_laure:0, aides:0 };
          const m = revMonth;
          const usingOverride = !!m;
          const v = m || d;
          app.innerHTML = header(`
            <section class="space-y-4">
              <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-3">
                <p class="text-[11px] uppercase tracking-[0.16em] text-slate-500 mb-2">Revenus du mois — ${monthLabel(cur)}</p>
                <div class="space-y-2">
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Ludovic</label>
                    <input id="rv-l" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${v.ludovic}" />
                  </div>
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Marie-Laure</label>
                    <input id="rv-m" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${v.marie_laure}" />
                  </div>
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Aides</label>
                    <input id="rv-a" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${v.aides}" />
                  </div>
                  <div class="flex gap-2 mt-2">
                    <button id="rv-save" class="flex-1 rounded-full bg-emerald-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-emerald-400 active:scale-[0.98] transition">Enregistrer pour ce mois</button>
                    ${usingOverride?`<button id="rv-reset" class="rounded-full border border-slate-700 px-4 py-2 text-[11px] text-slate-300 hover:border-emerald-500/60 hover:text-emerald-400">Revenir au défaut</button>`:''}
                  </div>
                  <p class="mt-1 text-[11px] text-slate-500">${usingOverride?"Ce mois utilise une valeur personnalisée.":"Ce mois utilise les revenus par défaut."}</p>
                </div>
              </div>

              <div class="rounded-2xl border border-slate-800 bg-slate-950/60 px-3 py-3">
                <p class="text-[11px] uppercase tracking-[0.16em] text-slate-500 mb-2">Valeurs par défaut (tous les mois)</p>
                <div class="space-y-2">
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Ludovic</label>
                    <input id="dv-l" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${d.ludovic}" />
                  </div>
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Marie-Laure</label>
                    <input id="dv-m" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${d.marie_laure}" />
                  </div>
                  <div>
                    <label class="text-[11px] uppercase tracking-[0.16em] text-slate-500">Aides</label>
                    <input id="dv-a" class="mt-1 w-full rounded-xl border border-slate-800 bg-slate-900/80 px-3 py-2 text-sm" inputmode="decimal" value="${d.aides}" />
                  </div>
                  <button id="dv-save" class="mt-2 w-full rounded-full border border-slate-700 px-4 py-2 text-[11px] text-slate-300 hover:border-emerald-500/60 hover:text-emerald-400">Mettre à jour le défaut</button>
                </div>
              </div>
            </section>
          `);
          wireHeader();
          const num = (id) => { const x = parseFloat($(id).value.replace(",",".")); return isNaN(x)?0:x; };
          $("rv-save").onclick = async () => {
            await sb.from("revenu_months").upsert({ month: k(), ludovic: num("rv-l"), marie_laure: num("rv-m"), aides: num("rv-a") }, { onConflict: "user_id,month" });
            await loadMonth(); render();
          };
          if ($("rv-reset")) $("rv-reset").onclick = async () => { await sb.from("revenu_months").delete().eq("month", k()); await loadMonth(); render(); };
          $("dv-save").onclick = async () => {
            await sb.from("revenu_defaults").update({ ludovic: num("dv-l"), marie_laure: num("dv-m"), aides: num("dv-a") }).eq("user_id", session.user.id);
            const { data } = await sb.from("revenu_defaults").select("*").maybeSingle(); revDefault = data; render();
          };
        }

        function openModal(inner){
          $("modal-root").innerHTML = `
            <div id="modal" class="fixed inset-0 z-40 flex items-end justify-center bg-black/60 backdrop-blur-sm">
              <div class="w-full max-w-md rounded-t-3xl bg-slate-950 border-t border-slate-800 px-4 pb-6 pt-4 animate-[slideUp_0.25s_ease-out]">
                <div class="flex justify-center mb-2"><div class="h-1 w-10 rounded-full bg-slate-700"></div></div>
                ${inner}
              </div>
            </div>`;
          $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
        }
        function closeModal(){ $("modal-root").innerHTML = ""; }

        if (SUPABASE_URL.includes("TON-PROJET")){
          document.body.innerHTML = `<div class=\"min-h-screen flex items-center justify-center bg-bg text-slate-100\"><div class=\"max-w-md mx-auto rounded-3xl border border-slate-800 bg-slate-950/80 px-5 py-6 shadow-2xl\"><h1 class=\"text-lg font-semibold mb-3\">Configuration requise</h1><p class=\"text-sm text-slate-400\">Ouvre <code>index.html</code> et renseigne <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> (Supabase → Settings → API). Puis recharge.</p></div></div>`;
          return;
        }

        sb.auth.getSession().then(({ data }) => { session = data.session; session ? showApp() : showAuth(); });
        if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
      })();
    </script>
  </body>
</html>
