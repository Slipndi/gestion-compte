name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Si ta branche s'appelle "master", change "main" par "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Injection des clés Supabase
        run: |
          # On remplace tes variables VITE_ par tes secrets GitHub dans le index.html
          sed -i 's|VITE_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g' index.html
          sed -i 's|VITE_SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g' index.html

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload du site web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
