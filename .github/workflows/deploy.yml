name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Injection des clés Supabase dans config.js
        run: |
          cp config.example.js config.js
          sed -i "s|VOTRE_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|" config.js
          sed -i "s|VOTRE_SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|" config.js

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload du site web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
